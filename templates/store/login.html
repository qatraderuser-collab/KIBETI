{% extends "store/base.html" %}

{% block title %}Log in — Zuri Luxee{% endblock %}

{% block content %}
<div class="container auth-wrap">
  <h1>Welcome back</h1>
  {% if request.GET.next %}<p class="auth-hint">Log in to continue to checkout.</p>{% endif %}
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <button type="submit" class="btn-pill btn-dark btn-block">Log in</button>
  </form>
  <p class="auth-alt">New here? <a href="{% url 'register' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Create an account</a></p>
</div>
{% endblock %}
